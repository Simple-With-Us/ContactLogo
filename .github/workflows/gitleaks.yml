name: Secret scanning
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.24.3"
  GITLEAKS_SHA256_X64: "9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c"
  GITLEAKS_SHA256_ARM64: "5f2edbe1f49f7b920f9e06e90759947d3c5dfc16f752fb93aaafc17e9d14cf07"

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install pinned gitleaks
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          tmp_root="${TMPDIR:-/tmp}"; tmp_root="${tmp_root%/}"
          rm -f "$tmp_root/gitleaks.tmp"
          rm -rf "$tmp_root/gitleaks-${GITLEAKS_VERSION}"

          case "$(uname -m)" in
            x86_64|amd64)  arch="x64";   want="$GITLEAKS_SHA256_X64" ;;
            aarch64|arm64) arch="arm64"; want="$GITLEAKS_SHA256_ARM64" ;;
            *) echo "::error::unsupported runner arch $(uname -m)"; exit 1 ;;
          esac

          tarball="$tmp_root/gitleaks.tar.gz"
          curl -fsSL --retry 3 --retry-delay 2 --max-time 120 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_${arch}.tar.gz" \
            -o "$tarball"

          got="$(sha256sum "$tarball" | cut -d' ' -f1)"
          if [ "$got" != "$want" ]; then
            echo "::error::gitleaks checksum mismatch (expected $want, got $got)"
            exit 1
          fi

          mkdir -p "$tmp_root/gitleaks-${GITLEAKS_VERSION}"
          tar -xzf "$tarball" -C "$tmp_root/gitleaks-${GITLEAKS_VERSION}" gitleaks
          echo "$tmp_root/gitleaks-${GITLEAKS_VERSION}" >> "$GITHUB_PATH"

      - name: Scan for secrets
        timeout-minutes: 5
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.before }}
          PUSH_AFTER: ${{ github.after }}
        run: |
          set -euo pipefail
          gitleaks version

          case "$EVENT" in
            pull_request)
              range="${PR_BASE}..${PR_HEAD}"
              ;;
            push)
              if [ -z "${PUSH_BEFORE:-}" ] || [ "$PUSH_BEFORE" = "0000000000000000000000000000000000000000" ]; then
                range=""
              else
                range="${PUSH_BEFORE}..${PUSH_AFTER}"
              fi
              ;;
            *)
              range=""
              ;;
          esac

          report="${RUNNER_TEMP:-/tmp}/gitleaks-report.json"
          rm -f "$report"

          if [ -n "$range" ]; then
            echo "scanning commit range: $range"
            gitleaks git --no-banner --redact --exit-code 0 \
              --report-format json --report-path "$report" --log-opts "$range" .
          else
            echo "scanning full history"
            gitleaks git --no-banner --redact --exit-code 0 \
              --report-format json --report-path "$report" .
          fi

          count=0
          if [ -s "$report" ]; then
            count="$(jq 'length' "$report")"
          fi

          if [ "$count" -gt 0 ]; then
            echo "::error::gitleaks found ${count} finding(s).  Structural details below; secret values are never printed."
            jq -r '.[] | "  rule=\(.RuleID) file=\(.File) line=\(.StartLine) commit=\(.Commit[0:12]) date=\(.Date[0:10])\n    fingerprint=\(.Fingerprint)"' "$report"
            rm -f "$report"
            exit 1
          fi

          echo "Gitleaks clean."
