name: Vercel production catch-up

on:
  workflow_run:
    workflows: ["CI", "E2E smoke"]
    types: [completed]
    branches: [main]
  schedule:
    - cron: '41 * * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/deploy/**
      - .github/workflows/vercel-catch-up.yml

permissions:
  contents: read
  actions: read

# Production runs (schedule, workflow_run, dispatch) share one group so main
# publishing stays serialized.  PR validation runs get a per-PR group: GitHub
# keeps only one pending run per group, so a shared group would let a PR run
# replace a queued production catch-up.
concurrency:
  group: vercel-production-catch-up${{ github.event_name == 'pull_request' && format('-pr-{0}', github.event.pull_request.number) || '' }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: node --test scripts/deploy/vercel-catch-up.test.mjs

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.VERCEL_CATCH_UP_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      VERCEL_ORG_ID: team_l3mWAejl1E08y8ijku5DpBE6
      VERCEL_PROJECT_ID: prj_jVLCCFZxItW389Nl7rAgtvynb0WJ
      VERCEL_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Load deploy token from shared Fleet-OPS secret scope
        env:
          INFISICAL_PROJECT_ID: ${{ secrets.INFISICAL_FLEET_OPS_PROJECT_ID }}
          INFISICAL_ENVIRONMENT: prod
          INFISICAL_SECRET_PATH: /
          INFISICAL_NAMES: VERCEL_TOKEN
          INFISICAL_REQUIRED: VERCEL_TOKEN
          INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_AUTOMATION_CLIENT_ID }}
          INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_AUTOMATION_CLIENT_SECRET }}
        run: |
          # Name the missing org secret instead of letting infisical-fetch.mjs
          # report only the downstream "VERCEL_TOKEN is empty" error.
          missing=""
          [ -n "$INFISICAL_PROJECT_ID" ] || missing="$missing INFISICAL_FLEET_OPS_PROJECT_ID"
          [ -n "$INFISICAL_CLIENT_ID" ] || missing="$missing INFISICAL_AUTOMATION_CLIENT_ID"
          [ -n "$INFISICAL_CLIENT_SECRET" ] || missing="$missing INFISICAL_AUTOMATION_CLIENT_SECRET"
          if [ -n "$missing" ]; then
            echo "::error::Org secret(s) not available to this workflow:$missing"
            exit 1
          fi
          node scripts/infisical-fetch.mjs
      - name: Check binding, deployed SHA, cooldown and exact-main CI
        id: gate
        run: node scripts/deploy/vercel-catch-up.mjs prepare
      - name: Install pinned Vercel CLI
        if: steps.gate.outputs.deploy == 'true'
        run: npm install --global vercel@64.5.0
      - name: Pull project settings and build from repo root
        if: steps.gate.outputs.deploy == 'true'
        run: |
          vercel pull --yes --environment=production
          vercel build --prod --yes
      - name: Recheck main, publisher binding and 3h window before upload
        if: steps.gate.outputs.deploy == 'true'
        id: recheck
        run: node scripts/deploy/vercel-catch-up.mjs
      - name: Deploy once and verify provider receipt
        if: steps.recheck.outputs.deploy == 'true'
        run: |
          set -euo pipefail
          vercel deploy --prebuilt --prod --yes --json \
            --meta fleetCommitSha="$(git rev-parse HEAD)" \
            --meta githubCommitSha="$(git rev-parse HEAD)" \
            --meta githubCommitRef=main > "$RUNNER_TEMP/vercel-deployment.json"
          node scripts/deploy/vercel-catch-up.mjs receipt "$RUNNER_TEMP/vercel-deployment.json"
