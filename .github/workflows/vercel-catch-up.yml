name: Vercel production catch-up

on:
  workflow_run:
    workflows: ["CI", "E2E smoke"]
    types: [completed]
    branches: [main]
  schedule:
    - cron: '41 * * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/deploy/**
      - .github/workflows/vercel-catch-up.yml

permissions:
  contents: read
  actions: read

# workflow_run and workflow_dispatch share one group so main publishing stays
# serialized.  PR validation runs get a per-PR group: GitHub keeps only one
# pending run per group, so a shared group would let a PR run replace a queued
# production catch-up.
#
# Scheduled runs use their own group.  When they shared the production group,
# CI/E2E-driven workflow_run completions queued ahead of the hourly cron and
# GitHub dropped most schedule ticks (~4/day vs 24).  sentry-ci-report only
# sends Crons check-ins for schedule-triggered completions, so Sentry raised
# hourly missed-check-in alerts (FLEET-INFRA-F6).  The deploy job's "Yield to
# an overlapping production run" step keeps the two groups from deploying at
# the same time: a scheduled run steps aside when a workflow_run/dispatch run
# is active, and a workflow_run/dispatch run waits for an active scheduled run.
# The Vercel-record gates in vercel-catch-up.mjs cannot do this alone, because
# a deployment record only exists once the prebuilt upload finishes.
concurrency:
  group: vercel-production-catch-up${{ github.event_name == 'pull_request' && format('-pr-{0}', github.event.pull_request.number) || (github.event_name == 'schedule' && '-schedule' || '') }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - run: node --test scripts/deploy/vercel-catch-up.test.mjs

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.VERCEL_CATCH_UP_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      VERCEL_ORG_ID: team_l3mWAejl1E08y8ijku5DpBE6
      VERCEL_PROJECT_ID: prj_jVLCCFZxItW389Nl7rAgtvynb0WJ
      VERCEL_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - name: Load deploy token from shared Fleet-OPS secret scope
        env:
          INFISICAL_PROJECT_ID: ${{ secrets.INFISICAL_FLEET_OPS_PROJECT_ID }}
          INFISICAL_ENVIRONMENT: prod
          INFISICAL_SECRET_PATH: /
          INFISICAL_NAMES: VERCEL_TOKEN
          INFISICAL_REQUIRED: VERCEL_TOKEN
          INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_AUTOMATION_CLIENT_ID }}
          INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_AUTOMATION_CLIENT_SECRET }}
          # Explicit opt-in: do not silently fall back to universal-auth elsewhere.
          INFISICAL_ALLOW_UNIVERSAL_AUTH: "true"
        run: |
          # Name the missing org secret instead of letting infisical-fetch.mjs
          # report only the downstream "VERCEL_TOKEN is empty" error.
          missing=""
          [ -n "$INFISICAL_PROJECT_ID" ] || missing="$missing INFISICAL_FLEET_OPS_PROJECT_ID"
          [ -n "$INFISICAL_CLIENT_ID" ] || missing="$missing INFISICAL_AUTOMATION_CLIENT_ID"
          [ -n "$INFISICAL_CLIENT_SECRET" ] || missing="$missing INFISICAL_AUTOMATION_CLIENT_SECRET"
          if [ -n "$missing" ]; then
            echo "::error::Org secret(s) not available to this workflow:$missing"
            exit 1
          fi
          node scripts/infisical-fetch.mjs
      - name: Yield to an overlapping production run
        id: yield
        env:
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # Other active production runs of this workflow, as "event" lines.
          active() {
            for status in queued in_progress; do
              gh api "repos/$REPO/actions/workflows/vercel-catch-up.yml/runs?status=$status&per_page=50" \
                --jq ".workflow_runs[] | select(.id != $RUN_ID and .event != \"pull_request\") | .event"
            done
          }
          if [ "$EVENT" = "schedule" ]; then
            events="$(active)"
            if grep -qxE "workflow_run|workflow_dispatch" <<< "$events"; then
              echo "A workflow_run/dispatch run is active and will publish main; this scheduled run skips deploy."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          else
            deadline=$(( $(date +%s) + 40 * 60 ))
            while events="$(active)"; grep -qx schedule <<< "$events"; do
              if [ "$(date +%s)" -ge "$deadline" ]; then
                echo "::error::A scheduled catch-up run stayed active for 40 minutes; not deploying alongside it."
                exit 1
              fi
              echo "Waiting for the active scheduled catch-up run to finish..."
              sleep 30
            done
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
      - name: Check binding, deployed SHA, cooldown and exact-main CI
        if: steps.yield.outputs.skip != 'true'
        id: gate
        run: node scripts/deploy/vercel-catch-up.mjs prepare
      - name: Install pinned Vercel CLI
        if: steps.gate.outputs.deploy == 'true'
        run: npm install --global vercel@64.5.0
      - name: Pull project settings and build from repo root
        if: steps.gate.outputs.deploy == 'true'
        run: |
          vercel pull --yes --environment=production
          vercel build --prod --yes
      - name: Recheck main, publisher binding and 3h window before upload
        if: steps.gate.outputs.deploy == 'true'
        id: recheck
        run: node scripts/deploy/vercel-catch-up.mjs
      - name: Deploy once and verify provider receipt
        if: steps.recheck.outputs.deploy == 'true'
        run: |
          set -euo pipefail
          vercel deploy --prebuilt --prod --yes --json \
            --meta fleetCommitSha="$(git rev-parse HEAD)" \
            --meta githubCommitSha="$(git rev-parse HEAD)" \
            --meta githubCommitRef=main > "$RUNNER_TEMP/vercel-deployment.json"
          node scripts/deploy/vercel-catch-up.mjs receipt "$RUNNER_TEMP/vercel-deployment.json"
