name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # macos-15 sits in a long org queue; cancelling in-progress drops the
  # iOS/kit jobs before they ever get a runner.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          GITHUB_SHA: ${{ github.sha }}
        run: npm run build

  kit:
    # macos-latest was starving for hours while macos-15 runners still
    # picked up the apple matrix on the same workflow; keep kit on the
    # same pool so swift test is not the only job stuck queued.
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Swift tests
        run: swift test

  # Builds the SwiftUI app shells (Apps/) that `swift test` never touches,
  # because they live in an XcodeGen-generated Xcode project, not the SwiftPM
  # package. Regenerates the project from project.yml so it always reflects
  # the committed spec, then builds each app target without codesigning.
  apple:
    runs-on: macos-26
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: ContactLogoiOS
            destination: "generic/platform=iOS Simulator"
            sentry_app: contactlogo
            sentry_secret: SENTRY_DSN
          - target: ContactLogoMac
            destination: "platform=macOS"
            sentry_app: contactlogo-mac
            sentry_secret: SENTRY_DSN_MACOS
          # The Sparkle-free Mac App Store / TestFlight build (CL-203).  A
          # compile break here would be a green PR followed by a failed ship,
          # so it is built on every pull request.  Its dSYMs are not uploaded:
          # the ContactLogoMac row already uploads the same sources' symbols.
          - target: ContactLogoMacAppStore
            destination: "platform=macOS"
            sentry_app: contactlogo-mac
            sentry_secret: SENTRY_DSN_MACOS
            skip_dsym_upload: true
    env:
      # iOS: Actions secret SENTRY_DSN.  Mac: SENTRY_DSN_MACOS.  Empty
      # stays dark (Cocoa no-ops).  GitHub masks the value in logs.
      SENTRY_DSN: ${{ secrets[matrix.sentry_secret] }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Cache DerivedData
        uses: actions/cache@v6
        with:
          path: .build/DerivedData
          key: ${{ runner.os }}-xcode-${{ matrix.target }}-${{ hashFiles('project.yml', 'Package.swift', 'Sources/**', 'Apps/**') }}
          restore-keys: |
            ${{ runner.os }}-xcode-${{ matrix.target }}-

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build ${{ matrix.target }}
        run: |
          xcodebuild build \
            -project ContactLogo.xcodeproj \
            -scheme ${{ matrix.target }} \
            -destination "${{ matrix.destination }}" \
            -derivedDataPath .build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            DEBUG_INFORMATION_FORMAT=dwarf-with-dsym \
            SENTRY_DSN="${SENTRY_DSN}"

      - name: Self-test the DSN guard
        run: bash scripts/ios-fleet/check-built-sentry-dsn.sh --self-test

      - name: Refuse an unsubstituted Sentry DSN
        run: bash scripts/ios-fleet/check-built-sentry-dsn.sh .build/DerivedData

      - name: Upload dSYMs to Sentry
        if: ${{ !matrix.skip_dsym_upload }}
        run: bash scripts/ios-fleet/upload-sentry-dsyms.sh --app "${{ matrix.sentry_app }}" --search .build/DerivedData

  # The Mac TestFlight pipeline (CL-203): the vendored ship tooling still
  # matches its pin, the scheduled-ship gate behaves, the shell scripts parse,
  # and the workflow, project spec, registry and profile map still agree.
  # Linux only; no secrets, no Xcode, no App Store Connect.
  ship-tooling:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Ship tooling matches its pin
        run: bash scripts/ios-fleet-pin.sh --check

      - name: Shell scripts parse
        run: |
          set -e
          for f in scripts/ios-fleet/ship-testflight.sh scripts/ios-fleet/scheduled-ship-gate.sh \
                   scripts/ios-collect-ship-logs.sh scripts/ios-stage-asc-key.sh \
                   scripts/mac-appstore-gm-prepare.sh scripts/mac-export-appstore-pkg.sh \
                   scripts/mac-install-appstore-profiles.sh scripts/ios-fleet-pin.sh; do
            bash -n "$f"
            echo "parses: $f"
          done
          node --check scripts/ios-fleet/asc-api.mjs
          node --check scripts/ios-fleet/asc-key.mjs
          node --check scripts/ios-fleet/version-plan.mjs
          node --check scripts/ios-fleet/shared-build.mjs

      - name: Scheduled ship gate tests
        run: |
          bash scripts/test-ios-scheduled-ship-gate.sh
          bash scripts/ios-fleet/test-asc-credentials.sh
          node --test scripts/ios-fleet/test-asc-credentials.mjs
          node --test scripts/ios-fleet/test-asc-key.test.mjs

      # The fleet's version-numbering rules (AFC-517):  the marketing version
      # is the next patch on the app's train and the build number is
      # INDEPENDENT of it, so App Store Connect can no longer show "1.0.N (N)".
      # The rules live in scripts/ios-fleet/version-plan.mjs (pure, no I/O);
      # this is their unit test.  Fully offline:  no network, no credentials.
      - name: Test the iOS fleet version-numbering rules
        run: node --test scripts/ios-fleet/version-plan.node-test.mjs

      - name: Fleet shared build counter (offline)
        run: node --test scripts/ios-fleet/shared-build.test.mjs

      - name: Mac TestFlight contract
        run: python3 scripts/check-mac-testflight-contract.py

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: Apps/ContactLogoAndroid
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # Default packages include the retired `tools` package; sdkmanager then
      # exits 1 with "Failed to find package 'tools'" on current GH runners.
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - uses: gradle/actions/setup-gradle@v6

      - name: Assemble debug
        run: ./gradlew assembleDebug --no-daemon

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Assemble release
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload Sentry mappings
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: simple-with-us
          SENTRY_PROJECT: contactlogo
        run: |
          set +e
          if [ -z "${SENTRY_AUTH_TOKEN:-}" ]; then
            echo "SENTRY_AUTH_TOKEN unset; skipping mapping upload"
            exit 0
          fi
          if ! command -v sentry-cli >/dev/null 2>&1; then
            SENTRY_INSTALL_DIR="${HOME}/.local/bin" curl -fsSL https://cli.sentry.dev/install | bash >/dev/null 2>&1 || true
            export PATH="${HOME}/.local/bin:${HOME}/.sentry/bin:${HOME}/.sentry-cli:${PATH}"
          fi
          if ! command -v sentry-cli >/dev/null 2>&1; then
            echo "::warning::sentry-cli missing; skipping mapping upload"
            exit 0
          fi
          mapping="app/build/outputs/mapping/release/mapping.txt"
          if [ ! -f "$mapping" ]; then
            echo "::warning::$mapping missing; skipping mapping upload"
            exit 0
          fi
          echo "Uploading R8 mapping (token length ${#SENTRY_AUTH_TOKEN})"
          # sentry-cli 2.x (same pin as sentry-deploy.yml) uses upload-proguard.
          sentry-cli upload-proguard --org "$SENTRY_ORG" --project "$SENTRY_PROJECT" "$mapping"
          if [ $? -ne 0 ]; then
            echo "::warning::sentry mapping upload failed; leaving job green"
          fi
          exit 0

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-test-report
          path: Apps/ContactLogoAndroid/app/build/reports/tests/testDebugUnitTest
          retention-days: 7
