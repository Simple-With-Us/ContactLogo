name: ContactLogo iOS TestFlight

# The iOS TestFlight lane (CL-204), called by .github/workflows/testflight.yml.
# That workflow owns every trigger, plans ONE build per release, and hands
# the single value to this lane (and the Mac lane) as the required `build`
# input.  This file carries no push/schedule triggers of its own.
#
# A standalone workflow_dispatch stays available as the explicit per-lane
# instruction:  pass a planned `build`, or leave it empty to plan one on
# the runner (the same --plan-build-only the release workflow runs).
#
# Auto-ship: a merge to main that touches the iOS app's native tree archives
# and uploads a fresh TestFlight build with no human step.  This is the
# fleet pipeline (Usage-Monitor, Socratic.Trade, CodeCaps), not a custom script:
#
#   scripts/ios-ship-testflight.sh -> scripts/ios-fleet/ship-testflight.sh
#
# Versioning (fixed mode):  the marketing version is the fixedMarketingVersion
# in scripts/ios-fleet/apps.json (0.1.0, it does not count up per ship) and
# the build is the shared merge-timestamp value planned once per release
# (max(S, M + 1)), passed here as `build` and on to the fleet script via
# --build.  The fleet script owns everything else:
#   - the rate gate (a minimum interval per app) and the same-HEAD skip, both at
#     the script defaults.  Never set IOS_TF_MIN_INTERVAL_SEC or any other gate
#     override as a standing value in this file;
#   - ensure-tf-ready (export compliance on the build this run uploaded) and the
#     mandatory What to Test notes (IOS_TF_RELEASE_NOTES=1, FLEET-PROTOCOL template).
# Nothing here depends on a repository variable.  The numeric app id lives in
# scripts/ios-fleet/apps.json.
#
# The scheduled-ship gate below re-verifies intent on this runner (seconds):
# only the caller's schedule event is path-diffed here, because the caller
# already gated the lane;  a tick with nothing to ship ends before Xcode.
#
# Ship state (last-ship sha and time, build sequence cache) lives in
# ~/.cache/ios-fleet, which a hosted runner starts empty every job.  It is
# restored and saved through actions/cache; without it the rate gate and the
# same-HEAD skip would see "no prior ship" on every run.
#
# Secrets (names only; no value is ever printed): ASC_KEY_ID, ASC_ISSUER_ID,
# ASC_KEY_P8 (App Store Connect API key, canonical home Fleet Secrets Fleet-OPS
# prod /asc), IOS_DIST_P12_BASE64, IOS_DIST_P12_PASSWORD (Apple Distribution
# certificate, canonical home Fleet-OPS prod /mac-certs).  Both are loaded at
# runtime by the dedicated steps below via the Simple-With-Us org machine
# identity; same-named repository secrets are only the GH_FALLBACK_ path.
# A release call passes them through secrets: inherit.
on:
  workflow_call:
    inputs:
      build:
        description: 'The release build planned once by testflight.yml (12-digit merge-timestamp build)'
        required: true
        type: string
      export_only:
        description: 'Archive + export the IPA only; do not upload (signing check)'
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      build:
        description: 'Planned 12-digit merge-timestamp build (leave empty to plan it on the runner)'
        required: false
        type: string
      export_only:
        description: 'Archive + export the IPA only; do not upload (signing check)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: contactlogo-ios-testflight
  cancel-in-progress: false

jobs:
  ship:
    name: TestFlight archive + upload
    if: github.event.repository.fork == false && github.ref == 'refs/heads/main'
    # Shared with mac-testflight.yml's ship job: the release build is one per
    # app across iOS and macOS (planned once by testflight.yml), so the two
    # lanes must never upload at the same time.  Queued, never cancelled.
    concurrency:
      group: contactlogo-testflight
      cancel-in-progress: false
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The scheduled gate diffs HEAD against the sha recorded by the last
          # successful ship, and the What to Test notes read `git log
          # <last-ship>..HEAD`.  A depth-1 checkout makes both uncomputable.
          fetch-depth: 0

      # Restore and save are separate steps (not the single actions/cache step)
      # because actions/cache only saves in its post step, and the post step is
      # skipped when the job fails.  A ship that uploaded and then failed later
      # must still record its state, or the next tick would re-upload.
      - name: Restore iOS ship state
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ios-fleet
          key: ios-fleet-contactlogo-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ios-fleet-contactlogo-

      # A hosted runner is a fresh VM, so nothing else can be holding a ship lock.
      # The fleet script keeps its archive and build-sequence locks as *.lockdir
      # directories inside the cached state.  A run cancelled between mkdir and
      # release would otherwise save its lock into the cache, and every later ship
      # would restore it and wait out the lock timeout.  Drop them here, and again
      # before the save below.
      - name: Drop stale ship locks from restored state
        run: find "$HOME/.cache/ios-fleet" -maxdepth 1 -type d -name '*.lockdir' -exec rmdir {} + 2>/dev/null || true

      # Runs FIRST so a tick with nothing to ship costs seconds.  The release
      # caller already gated this lane;  this re-verifies on the ship runner
      # (a standalone dispatch votes ship:  an explicit per-lane instruction).
      - name: Scheduled ship gate (skip unless iOS code changed)
        id: gate
        run: |
          bash "$GITHUB_WORKSPACE/scripts/ios-fleet/scheduled-ship-gate.sh" \
            --event "${{ github.event_name }}" \
            --path-prefix 'Apps/ContactLogoiOS/' \
            --path-prefix 'Sources/ContactLogoKit/' \
            --path-prefix 'project.yml' \
            --repo-root "$GITHUB_WORKSPACE" \
            contactlogo

      - name: Assert stable Xcode 26 and a non-beta host OS
        if: steps.gate.outputs.should_ship == '1'
        run: |
          set -euo pipefail
          echo "DEVELOPER_DIR=${DEVELOPER_DIR}"
          xcodebuild -version
          case "$DEVELOPER_DIR" in
            *[Bb]eta*)
              echo "::error::DEVELOPER_DIR resolves to a beta Xcode: $DEVELOPER_DIR"
              exit 1
              ;;
          esac
          if xcodebuild -version | grep -qi beta; then
            echo "::error::xcodebuild reports a beta Xcode toolchain"
            exit 1
          fi
          xcode_major="$(xcodebuild -version | awk 'NR==1 {split($2, parts, "."); print parts[1]}')"
          [[ "$xcode_major" -ge 26 ]] || { echo '::error::Stable Xcode 26 or later is required.'; exit 1; }
          # Apple stamps BuildMachineOSBuild into the IPA.  A beta host (a
          # trailing letter after the digits, e.g. 26A5406e) is Invalid Binary.
          os="$(sw_vers -productVersion)"
          build="$(sw_vers -buildVersion)"
          echo "macOS ${os} (${build})"
          if echo "$build" | grep -Eq '[0-9][a-z]$'; then
            echo "::error::macOS ${os} build ${build} is a beta host.  App Store rejects these as INVALID_BINARY."
            exit 1
          fi
          NONINTERACTIVE=1 HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen

      - name: Load App Store Connect key (Fleet Secrets via Infisical)
        if: steps.gate.outputs.should_ship == '1'
        uses: ./.github/actions/infisical-secrets
        with:
          names: ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8
          required: ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8
          project-id: ${{ secrets.INFISICAL_FLEET_OPS_PROJECT_ID }}
          secret-path: /asc
          client-id: ${{ secrets.INFISICAL_UNIVERSAL_AUTH_CLIENT_ID || secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET || secrets.INFISICAL_CLIENT_SECRET }}
        env:
          GH_FALLBACK_ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          GH_FALLBACK_ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          GH_FALLBACK_ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}

      - name: Load Apple Distribution certificate (Fleet Secrets via Infisical)
        if: steps.gate.outputs.should_ship == '1'
        uses: ./.github/actions/infisical-secrets
        with:
          names: IOS_DIST_P12_BASE64 IOS_DIST_P12_PASSWORD
          required: IOS_DIST_P12_BASE64 IOS_DIST_P12_PASSWORD
          project-id: ${{ secrets.INFISICAL_FLEET_OPS_PROJECT_ID }}
          secret-path: /mac-certs
          client-id: ${{ secrets.INFISICAL_UNIVERSAL_AUTH_CLIENT_ID || secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET || secrets.INFISICAL_CLIENT_SECRET }}
        env:
          GH_FALLBACK_IOS_DIST_P12_BASE64: ${{ secrets.IOS_DIST_P12_BASE64 }}
          GH_FALLBACK_IOS_DIST_P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}

      - name: Load Sentry secrets (best effort, Infisical then repository secrets)
        if: steps.gate.outputs.should_ship == '1'
        uses: ./.github/actions/infisical-secrets
        with:
          names: SENTRY_DSN SENTRY_AUTH_TOKEN
          project-id: ${{ secrets.INFISICAL_PROJECT_ID }}
          client-id: ${{ secrets.INFISICAL_UNIVERSAL_AUTH_CLIENT_ID || secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET || secrets.INFISICAL_CLIENT_SECRET }}
        env:
          GH_FALLBACK_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          GH_FALLBACK_SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      - name: Stage ASC key and prepare signing
        if: steps.gate.outputs.should_ship == '1'
        run: |
          set +o xtrace
          set -euo pipefail
          printf '%s\n' "$ASC_KEY_P8" | bash "$GITHUB_WORKSPACE/scripts/ios-stage-asc-key.sh"
          ASC_KEY_PATH="$(sed -n 's/^ASC_KEY_PATH=//p' "$GITHUB_ENV" | tail -n 1)"
          export ASC_KEY_PATH
          bash "$GITHUB_WORKSPACE/scripts/ios-appstore-gm-prepare.sh"

      # The release caller hands the one planned build in;  a standalone
      # dispatch without one plans it here instead (the same read-only
      # --plan-build-only, on the App Store Connect credential above).
      - name: Resolve the release build
        id: build
        if: steps.gate.outputs.should_ship == '1'
        env:
          BUILD_INPUT: ${{ inputs.build }}
        run: |
          set -euo pipefail
          if [ -n "${BUILD_INPUT:-}" ]; then
            [[ "$BUILD_INPUT" =~ ^[1-9][0-9]{11}$ ]] || { echo "::error::build input is not a 12-digit merge-timestamp build"; exit 1; }
            build="$BUILD_INPUT"
            echo "[ios-ship] release build from the caller: $build"
          else
            echo "[ios-ship] no build input; planning it on this runner"
            build="$(bash scripts/ios-fleet/ship-testflight.sh contactlogo --repo-root "$GITHUB_WORKSPACE" --plan-build-only)"
            [[ "$build" =~ ^[1-9][0-9]{11}$ ]] || { echo "::error::plan-build: malformed build '${build}'"; exit 1; }
            echo "[ios-ship] planned release build: $build"
          fi
          echo "build=${build}" >> "$GITHUB_OUTPUT"

      - name: Ship ContactLogo to TestFlight
        if: steps.gate.outputs.should_ship == '1'
        env:
          # Owner binding 2026-09-08:  What to Test is published on every upload.
          IOS_TF_RELEASE_NOTES: "1"
          EXPORT_ONLY_INPUT: ${{ inputs.export_only }}
          RELEASE_BUILD: ${{ steps.build.outputs.build }}
        run: |
          args=(--build "$RELEASE_BUILD")
          if [ "${EXPORT_ONLY_INPUT:-false}" = "true" ]; then
            echo "[ios-ship] export_only=true: archive + export the IPA, no upload"
            args+=(--export-only)
          fi
          bash scripts/ios-ship-testflight.sh ${args[@]+"${args[@]}"}

      # Sync the standing testers and attach/submit the new build to the public
      # external group.  A failure here is a warning, never a red ship.
      - name: Sync standing TestFlight testers
        if: success() && steps.gate.outputs.should_ship == '1' && inputs.export_only != true
        continue-on-error: true
        env:
          ASC_STANDING_TESTERS: ${{ secrets.ASC_STANDING_TESTERS }}
        run: |
          for e in $(printf '%s' "${ASC_STANDING_TESTERS:-}" | tr ',;' '  '); do
            echo "::add-mask::${e}"
          done
          set +e
          appleid="$(python3 -c 'import json;print(json.load(open("scripts/ios-fleet/apps.json"))["apps"]["contactlogo"]["appleId"])')"
          appleid_rc=$?
          set -e
          if [ "$appleid_rc" -ne 0 ] || [ -z "$appleid" ]; then
            echo "::warning title=TestFlight standing testers::could not read the contactlogo appleId from scripts/ios-fleet/apps.json (rc=${appleid_rc}); tester sync skipped.  The TestFlight upload itself succeeded."
            exit 0
          fi
          set +e
          node scripts/ios-fleet/asc-api.mjs ensure-standing-testers "$appleid"
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "::warning title=TestFlight standing testers::tester sync exited ${rc}; see the standing-testers lines above.  The TestFlight upload itself succeeded."
          fi

      - name: Drop ship locks before saving state
        if: ${{ always() && steps.gate.outputs.should_ship == '1' }}
        run: find "$HOME/.cache/ios-fleet" -maxdepth 1 -type d -name '*.lockdir' -exec rmdir {} + 2>/dev/null || true

      # Saved even when the ship step failed or the run was cancelled, but only on
      # ticks that actually tried to ship (a no-op tick changes no state).
      - name: Save iOS ship state
        if: ${{ always() && steps.gate.outputs.should_ship == '1' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ios-fleet
          key: ios-fleet-contactlogo-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Remove runner signing material
        if: ${{ always() && steps.gate.outputs.should_ship == '1' }}
        run: |
          set +o xtrace
          set -euo pipefail
          security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" >/dev/null 2>&1 || true
          rm -f "$RUNNER_TEMP/app-signing-kc-pass"
          if [[ -n "${ASC_KEY_PATH:-}" && "$ASC_KEY_PATH" == "$RUNNER_TEMP"/asc-signing.*/AuthKey.p8 ]]; then
            rm -rf "$(dirname "$ASC_KEY_PATH")"
          fi
          # altool staging copy (AuthKey_<KEY_ID>.p8); remove only the file this
          # run staged.  Avoid `rm -rf` of the directory -- other runs on the
          # shared runner may have unrelated keys there.
          if [[ -n "${ASC_KEY_ID:-}" ]]; then
            rm -f "${HOME}/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          fi
