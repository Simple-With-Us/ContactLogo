version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Chicago
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      npm-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - github-actions

    ignore:
      # gitleaks-action v3 aborts on orgs without a paid GITLEAKS_LICENSE.
      # v2 is free and runs the scan. Remove this once a license is purchased.
      - dependency-name: "gitleaks/gitleaks-action"
